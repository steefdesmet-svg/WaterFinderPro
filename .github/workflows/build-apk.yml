name: Build WaterFinder Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WaterFinderPro-build-log
          path: build.log
          retention-days: 7

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WaterFinderPro-0.1.0-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WaterFinderPro-APK
          path: WaterFinderPro-0.1.0-alpha.apk
          retention-days: 30
